name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: setup
        run: make setup PYTHON=python
      - name: lint
        run: |
          .venv/bin/pip install ruff
          .venv/bin/ruff check backend ai tests simulator --select E9,F63,F7,F82,F401,F811,F841
      - name: test
        run: make test
      - name: build web
        run: make build
      - name: build image
        run: docker build -t safenest-alerts .
      - name: cloud-check
        run: make cloud-check

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Gated by the feature flag (repository variable); false by default, so this job is skipped.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_CLOUD_DEPLOY == 'true'
    env:
      ENABLE_CLOUD_DEPLOY: ${{ vars.ENABLE_CLOUD_DEPLOY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: deploy
        run: bash deploy/deploy.sh
