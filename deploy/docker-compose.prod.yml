services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENABLE_CLOUD_DEPLOY: "false"
      MODEL_ADAPTER: mock
      DATABASE_URL: sqlite:////data/safenest.db
    volumes:
      - safenest-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  safenest-data:
